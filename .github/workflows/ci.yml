name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile multiclaude.py tests/*.py
      - name: Shell syntax
        run: bash -n install.sh
      - name: Tests (fake claude CLI, no accounts needed)
        run: python -m unittest discover -s tests -v
